[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "daimo"
dynamic = ["version"]
description = "daimo: a discriminative AI-powered motif optimizer, a PyTorch implementation of DiMO and DAMO that runs on GPUs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = [
    "biopython>=1.81",
    "click>=8.0",
    "memelite>=0.4",
    "numpy>=1.21",
    "scikit-learn>=1.1",
    "torch>=1.13",
    "tqdm>=4.64",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
daimo = "daimo.cli:main"

[tool.setuptools.dynamic]
version = { attr = "daimo.__version__" }

[tool.setuptools.packages.find]
include = ["daimo*"]
